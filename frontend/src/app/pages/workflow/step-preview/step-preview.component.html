<div class="dashboard-page">
  <div class="page-intro-bar no-print">
    <div>
      <h1 class="page-main-title">Resume Preview</h1>
      <p class="page-main-subtitle">
        Preview and download the generated resume in the Algoworks template.
      </p>
    </div>
    <div class="intro-actions">
      <button type="button" class="btn-outline" (click)="returnToGenerator()">
        ← Resume Generator
      </button>
      <button type="button" class="btn-primary-action" (click)="printOrSaveBrowserPdf()">
        Download PDF
      </button>
    </div>
  </div>

  <div class="latex-paper-container">
    <article class="latex-paper-sheet template-algoworks" aria-label="ATS Resume Preview">
      <app-algoworks-resume
        [resume]="state.editableStructured()"
        [fallbackTitle]="state.jobTitle()"
      />
    </article>
  </div>
</div>
