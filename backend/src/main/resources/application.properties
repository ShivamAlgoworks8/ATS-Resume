spring.application.name=ats-resume-maker

# No localhost fallback: if MONGODB_URI is not loaded the app must fail loudly instead of silently saving to a local MongoDB.
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:ats_resume_maker}

server.port=${SERVER_PORT:8080}

app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
