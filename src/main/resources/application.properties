spring.application.name=ats-resume-maker

# MongoDB connection is read from environment variables; no credentials in source control.
# Example: export MONGODB_URI="mongodb://user:pass@localhost:27017/?authSource=admin"
# Falls back to a local, unauthenticated MongoDB if MONGODB_URI is not set.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:ats_resume_maker}

server.port=${SERVER_PORT:8080}

# Resume module: where uploaded files are stored on local disk, and upload size limits
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
